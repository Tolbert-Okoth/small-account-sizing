[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lotsizing"
version = "0.1.0"
description = "Risk-based lot sizing for small trading accounts (floor vs nearest rounding, hard risk cap, below-minimum policy) and the transfer coefficient it costs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]
keywords = ["position sizing", "risk management", "lot size", "transfer coefficient", "fundamental law", "prop firm"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
